
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festa de Encerramento</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;

    background: linear-gradient(
        90deg,
        red, orange, yellow, chartreuse,
        lime, springgreen, cyan, dodgerblue,
        blue, blueviolet, magenta, #FF007F
    );

    background-size: 400% 400%;
    animation: rainbow 8s linear infinite;
}

@keyframes rainbow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    width: 95%;
    text-align: center;
    color: black;
    text-shadow: 0 0 15px rgba(0,0,0,.5);
}

h1 {
    font-size: clamp(35px, 8vw, 100px);
    font-weight: 900;
}

h2 {
    font-size: clamp(22px, 5vw, 55px);
    margin-bottom: 25px;
}

.name {
    font-size: clamp(35px, 7vw, 85px);
    font-weight: 900;
}

.classroom {
    font-size: clamp(24px, 4vw, 45px);
    font-weight: bold;
    margin-top: 12px;
}

.subtitle {
    font-size: clamp(16px, 3vw, 30px);
    margin-top: 20px;
}

.hidden {
    display: none !important;
}

.animate {
    animation: appear 1s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(60px) scale(.7);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes zoom {
    from {
        opacity: 0;
        transform: scale(.2);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}
</style>
</head>

<body>

<div class="container">

    <div id="intro">
        <h1 class="animate">FESTA DE<br>ENCERRAMENTO</h1>
        <p class="subtitle">Um momento especial para celebrar!</p>
    </div>

    <div id="thanks" class="hidden">
        <h2 id="heading"></h2>
        <div id="student" class="name"></div>
        <div id="classroom" class="classroom"></div>
        <p class="subtitle">Vocês fizeram parte dessa história!</p>
    </div>

    <div id="more" class="hidden">
        <h1 class="animate">E MAIS OUTROS!</h1>
        <p class="subtitle">Cada estudante fez parte dessa história!</p>
    </div>

    <div id="final" class="hidden">
        <h1 class="animate">OBRIGADO!</h1>
        <p class="subtitle">
            Nossa história não seria a mesma sem vocês!
            <br><br>
            Boas férias e até a próxima!
        </p>
    </div>

</div>

<script>
const students = [
    { name: "Alex", classroom: "8A" },
    { name: "Guilherme", classroom: "8A" },
    { name: "Hemanoelle", classroom: "8A" },
    { name: "Jamilly", classroom: "8A" },

    { name: "Daniel", classroom: "8B" },
    { name: "Lucas", classroom: "8B" },
    { name: "Nicolas", classroom: "8B" },

    { name: "Kaiky", classroom: "9A" },
    { name: "Georgio", classroom: "9B" },

    { name: "Gabriel", classroom: "1A" },
    { name: "Haifa", classroom: "1A" },
    { name: "Heverton", classroom: "1A" },
    { name: "Christopher", classroom: "1D" },

    { name: "Ana Vitória", classroom: "2A" },
    { name: "Anibelle", classroom: "2A" },
    { name: "Jhenny", classroom: "2A" },
    { name: "Julia", classroom: "2B" },
    { name: "Anderson", classroom: "2C" },
    { name: "Ketlin", classroom: "2C" },

    { name: "André", classroom: "3A" },
    { name: "Barbara", classroom: "3A" },
    { name: "Calvin", classroom: "3A" },
    { name: "Leandro", classroom: "3A" },
    { name: "João Pedro", classroom: "3A" },
    { name: "Sarah", classroom: "3A" },
    { name: "Gustavo", classroom: "3C" }
];

const classroomOrder = [
    "8A", "8B", "9A", "9B",
    "1A", "1D", "2A", "2B", "2C",
    "3A", "3C"
];

students.sort((a, b) => {
    const classA = classroomOrder.indexOf(a.classroom);
    const classB = classroomOrder.indexOf(b.classroom);

    if (classA !== classB) return classA - classB;

    return a.name.localeCompare(b.name, "pt-BR");
});

const intro = document.getElementById("intro");
const thanks = document.getElementById("thanks");
const more = document.getElementById("more");
const final = document.getElementById("final");

const heading = document.getElementById("heading");
const student = document.getElementById("student");
const classroom = document.getElementById("classroom");

let index = 0;
let currentClass = "";

function animateElement(element) {
    element.classList.remove("animate");
    void element.offsetWidth;
    element.classList.add("animate");
}

function showStudent() {

    if (index >= students.length) {
        thanks.classList.add("hidden");
        more.classList.remove("hidden");

        setTimeout(() => {
            more.classList.add("hidden");
            final.classList.remove("hidden");
        }, 4000);

        return;
    }

    const current = students[index];

    // Introduce a new classroom
    if (current.classroom !== currentClass) {
        currentClass = current.classroom;

        student.textContent = "";
        classroom.textContent = "";

        heading.textContent = "ALUNOS DO " + currentClass;

        student.classList.add("hidden");
        classroom.classList.add("hidden");

        animateElement(heading);

        setTimeout(() => {
            student.classList.remove("hidden");
            classroom.classList.remove("hidden");
            showStudent();
        }, 2200);

        return;
    }

    student.textContent = current.name;
    classroom.textContent = "Turma " + current.classroom;

    animateElement(student);
    animateElement(classroom);

    index++;

    setTimeout(showStudent, 2500);
}

// START PRESENTATION
setTimeout(() => {
    intro.classList.add("hidden");
    thanks.classList.remove("hidden");

    showStudent();
}, 4000);

</script>

</body>
</html>
